<script>
(() => {
"use strict";
const CONFIG = window.PULSE_CONFIG || { url:"", key:"" };
const LEGACY_CONFIG_KEY = "pulse-supabase-config-v4";
const LOCAL_CACHE = "pulse-commercial-v13";
const LOCAL_PREFS = "pulse-commercial-prefs-v1";
let sb=null, session=null, profile=null, state={expenses:[],categories:[],payments:[],payers:[],budgets:[],recurring:[],financial:null,goals:[],networth:[],recurringPlans:[],reminders:[]};
let editingId=null;let editingBudgetId=null;


const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>"₹"+Number(v||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const uid=()=>crypto.randomUUID();
function toast(m){$("toast").textContent=m;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2200)}
function getStoredConfig(){try{return JSON.parse(localStorage.getItem(LEGACY_CONFIG_KEY)||"null")}catch{return null}}
function getConfig(){if(CONFIG.url&&CONFIG.key)return CONFIG;const x=getStoredConfig();return x&&x.url&&x.key?x:{url:"",key:""}}
function cache(){}
function loadCache(){}
function openModal(id){$(id).classList.add("show")}
function closeModal(id){$(id).classList.remove("show")}
function setView(name){document.querySelectorAll("[data-view]").forEach(x=>x.hidden=x.dataset.view!==name);document.querySelectorAll("[data-nav]").forEach(x=>x.classList.toggle("active",x.dataset.nav===name))}
function monthKey(d){return String(d||"").slice(0,7)}
function normalizeMonth(m){return String(m||"").slice(0,7)}
function monthDbDate(m){return normalizeMonth(m)+"-01"}
function currentMonth(){return new Date().toISOString().slice(0,7)}
function fmtMonth(m){return new Date(m+"-02").toLocaleDateString("en-IN",{month:"long",year:"numeric"})}

function authScreen(message=""){
 document.body.innerHTML=`<div class="auth"><div class="hero">
 <div class="logo">✦</div><h2>Pulse</h2><p>Your money, your rules. Private by design.</p>
 <div class="note">Your expenses are protected by Supabase Auth + PostgreSQL Row Level Security. Each account sees only its own data.</div>
 <button id="googleBtn" class="googleBtn" type="button">
  <svg class="googleIcon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.35 12.23c0-.79-.07-1.55-.23-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.7 2.91-4.21 2.91-7.42Z"/><path fill="#34A853" d="M12 21.7c2.63 0 4.84-.87 6.45-2.35l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.74 9.74 0 0 0 12 21.7Z"/><path fill="#FBBC05" d="M6.54 13.79A5.85 5.85 0 0 1 6.23 12c0-.62.11-1.23.31-1.79V7.68H3.3A9.74 9.74 0 0 0 2.25 12c0 1.57.38 3.05 1.05 4.32l3.24-2.53Z"/><path fill="#EA4335" d="M12 6.18c1.43 0 2.72.49 3.73 1.45l2.8-2.8C16.84 3.18 14.63 2.3 12 2.3a9.74 9.74 0 0 0-8.7 5.38l3.24 2.53C7.31 7.9 9.46 6.18 12 6.18Z"/></svg>
  Continue with Google
 </button>
 <div class="oauthDivider"><span>or</span></div>
 <div class="form">
  <div class="field full"><label>Email</label><input id="authEmail" type="email" autocomplete="email"></div>
  <div class="field full"><label>Password</label><input id="authPassword" type="password" autocomplete="current-password"></div>
 </div>
 <div class="modalFoot"><button id="loginBtn" class="btn primary">Sign in</button><button id="signupBtn" class="btn">Create account</button></div>
 <button id="forgotBtn" class="linkBtn" type="button">Forgot password?</button>
 <div id="authMsg" style="color:#94a3b8;margin-top:12px">${esc(message)}</div>
 </div></div>`;
 $("googleBtn").onclick=signInWithGoogle;
 $("loginBtn").onclick=login; $("signupBtn").onclick=signup; $("forgotBtn").onclick=forgotPassword;
}

async function signInWithGoogle(){
 const btn=$("googleBtn");
 if(btn){btn.disabled=true;btn.textContent="Connecting to Google…";}
 const redirectTo=location.origin+location.pathname;
 const r=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo}});
 if(r.error){
  if(btn){btn.disabled=false;btn.innerHTML='<span class="googleIcon" style="display:inline-flex;align-items:center">G</span> Continue with Google';}
  $("authMsg").textContent=r.error.message;
 }
}

function configScreen(){
 document.body.innerHTML=`<div class="auth"><div class="hero">
 <div class="logo">✦</div><h2>Pulse setup</h2><p>One-time deployment configuration.</p>
 <div class="note">For the commercial build, put your <b>sb_publishable_...</b> key in <code>config.js</code>. Never put a secret/service-role key here.</div>
 <div class="form"><div class="field full"><label>Supabase Project URL</label><input id="setupUrl" placeholder="https://your-project.supabase.co"></div><div class="field full"><label>Publishable key</label><input id="setupKey" placeholder="sb_publishable_..."></div></div>
 <div class="modalFoot"><button id="saveSetup" class="btn primary">Connect Pulse</button></div>
 </div></div>`;
 $("saveSetup").onclick=async()=>{const url=$("setupUrl").value.trim().replace(/\/+$/,""),key=$("setupKey").value.trim();if(!/^https:\/\/[a-z0-9-]+\\.supabase\\.co(m)?$/i.test(url)||!key.startsWith("sb_publishable_")){alert("Enter a valid Supabase URL and sb_publishable_ key.");return}localStorage.setItem(LEGACY_CONFIG_KEY,JSON.stringify({url,key}));location.reload()};
}

async function initClient(){
 const c=getConfig();
 if(!c.url||!c.key){configScreen();return false}
 if(!window.supabase){alert("Supabase library failed to load. Check your internet connection.");return false}
 sb=window.supabase.createClient(c.url,c.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 const {data,error}=await sb.auth.getSession();
 if(error){authScreen(error.message);return false}
 session=data.session;
 sb.auth.onAuthStateChange((_e,s)=>{session=s; if(s) loadAll();});
 if(!session){authScreen();return false}
 await loadAll();return true;
}

async function login(){
 const e=$("authEmail").value.trim(),p=$("authPassword").value;
 if(!e||!p){$("authMsg").textContent="Enter email and password.";return}
 const r=await sb.auth.signInWithPassword({email:e,password:p});
 $("authMsg").textContent=r.error?r.error.message:"Signed in.";
}
async function forgotPassword(){
 const e=$("authEmail").value.trim();
 if(!e){$("authMsg").textContent="Enter your email first.";$("authEmail").focus();return}
 const r=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});
 $("authMsg").textContent=r.error?r.error.message:"Password reset email sent. Check your inbox.";
}
async function signup(){
 const e=$("authEmail").value.trim(),p=$("authPassword").value;
 if(!e||p.length<8){$("authMsg").textContent="Use a valid email and a password of at least 8 characters.";return}
 const r=await sb.auth.signUp({email:e,password:p,options:{emailRedirectTo:location.origin+location.pathname}});
 $("authMsg").textContent=r.error?r.error.message:(r.data.session?"Account created.":"Account created. Check your email if confirmation is required.");
}

async function loadAll(){
 if(!session)return; const uid=session.user.id;
 const [p,c,pm,py,b,r,e,financial,goals,nw,rp,rem]=await Promise.all([
  sb.from("profiles").select("*").eq("id",uid).maybeSingle(),sb.from("categories").select("*").eq("user_id",uid).order("name"),sb.from("payment_methods").select("*").eq("user_id",uid).order("name"),sb.from("payers").select("*").eq("user_id",uid).order("name"),sb.from("budgets").select("*").eq("user_id",uid).order("month",{ascending:false}),sb.from("recurring_expenses").select("*").eq("user_id",uid).order("next_date"),sb.from("expenses").select("*").eq("user_id",uid).order("date",{ascending:false}).order("created_at",{ascending:false}),sb.from("monthly_financials").select("*").eq("user_id",uid).eq("month",currentMonth()).maybeSingle(),sb.from("pulse_goals").select("*").eq("user_id",uid).order("target_date"),sb.from("pulse_net_worth").select("*").eq("user_id",uid).order("month",{ascending:false}),sb.from("pulse_recurring_plans").select("*").eq("user_id",uid).order("next_date"),sb.from("pulse_reminders").select("*").eq("user_id",uid).order("due_at")
 ]);
 [goals,nw,rp,rem].forEach(x=>{if(x?.error?.code==="42P01"){x.error=null;x.data=[]}}); if(financial?.error?.code==="42P01")financial={data:null,error:null};
 const bad=[p,c,pm,py,b,r,e,financial].find(x=>x.error); if(bad){console.error(bad.error);toast("Cloud load error: "+bad.error.message);return}
 profile=p.data||{id:uid,display_name:session.user.email.split("@")[0],currency:"INR"};state.categories=(c.data||[]).map(x=>({id:x.id,name:x.name,icon:x.icon||"•"}));state.payments=(pm.data||[]).map(x=>({id:x.id,name:x.name}));state.payers=(py.data||[]).map(x=>({id:x.id,name:x.name}));state.budgets=(b.data||[]).map(x=>({...x,month:normalizeMonth(x.month)}));state.recurring=r.data||[];state.financial=financial.data||null;state.goals=goals.data||[];state.networth=nw.data||[];state.recurringPlans=rp.data||[];state.reminders=rem.data||[];state.expenses=(e.data||[]).map(x=>({id:x.id,date:x.date,detail:x.detail,type:x.type,amount:Number(x.amount),paidvia:x.paid_via,paidby:x.paid_by,notes:x.notes||""}));cache();renderApp();
}

function appShell(){
 document.body.innerHTML=`<div class="app">
<header class="top"><div class="brand"><div class="logo">✦</div><div><h1>Pulse</h1><p>Your private money command center</p></div></div>
<div class="actions"><span id="syncBadge" class="badge">☁ Synced</span><div class="desktopNav"><button class="navLink active" data-nav="home">Home</button><button class="navLink" data-nav="expenses">Expenses</button><button class="navLink" data-nav="reports">Reports</button><button class="navLink" data-nav="savings">Savings</button><button class="navLink" data-nav="budgets">Budgets</button><button class="navLink" data-nav="wealth">Wealth</button></div><button class="btn accountBtn" id="profileBtn" aria-haspopup="menu" aria-expanded="false">👤 <span id="userName">Account</span> <span class="chev">⌄</span></button><div id="accountMenu" class="accountMenu" aria-hidden="true">

</div><button class="btn setupBadge" id="setupBtn">✦ Setup</button><button class="btn desktop" id="settingsBtn">⚙ Settings</button><button class="btn primary" id="addBtn">＋ Add expense</button></div></header>

function toggleAccountMenu(e){
 const m=$("accountMenu"), b=$("profileBtn");
 if(!m||!b)return;
 if(e)e.stopPropagation();
 const open=!m.classList.contains("open");
 m.classList.toggle("open",open);
 m.setAttribute("aria-hidden",open?"false":"true");
 b.setAttribute("aria-expanded",open?"true":"false");
 if(open){const r=b.getBoundingClientRect();m.style.top=(r.bottom+8)+"px";m.style.right=Math.max(12,window.innerWidth-r.right)+"px";$("accountMenuEmail").textContent=session?.user?.email||"Pulse account";}
}
function closeAccountMenu(){
 const m=$("accountMenu"),b=$("profileBtn");
 if(m){m.classList.remove("open");m.setAttribute("aria-hidden","true");}
 if(b)b.setAttribute("aria-expanded","false");
}

function renderBudgetHealth(){
  const m=currentMonth();
  const monthBudgets=state.budgets.filter(b=>normalizeMonth(b.month)===m);
  const overall=monthBudgets.find(b=>!b.category_id);
  const monthExpenses=state.expenses.filter(x=>monthKey(x.date)===m);
  if(!monthBudgets.length){
    $("budgetHealth").innerHTML='<div class="empty">No budget for this month.<br><button class="btn primary" style="margin-top:10px" id="quickBudget">Set one</button></div>';
    setTimeout(()=>$("quickBudget")?.addEventListener("click",()=>openBudget()),0);
    return;
  }
  if(overall){
    const spent=monthExpenses.reduce((s,x)=>s+x.amount,0);
    const pct=Math.min(100,spent/Number(overall.amount)*100);
    const remaining=Math.max(0,Number(overall.amount)-spent);
    $("budgetHealth").innerHTML=`<div class="budgetTop"><strong>${money(spent)} spent</strong><strong>${money(overall.amount)}</strong></div><div class="progress"><div style="width:${pct}%"></div></div><p style="color:#94a3b8;font-size:12px">${money(remaining)} remaining • ${pct.toFixed(0)}% used</p>`;
    return;
  }
  const categoryBudgets=monthBudgets.filter(b=>b.category_id);
  const totalBudget=categoryBudgets.reduce((s,b)=>s+Number(b.amount||0),0);
  const spent=categoryBudgets.reduce((sum,b)=>sum+monthExpenses.filter(x=>x.type===b.category_name).reduce((s,x)=>s+x.amount,0),0);
  const pct=totalBudget?Math.min(100,spent/totalBudget*100):0;
  $("budgetHealth").innerHTML=`<div class="budgetTop"><strong>${money(spent)} spent</strong><strong>${money(totalBudget)}</strong></div><div class="progress"><div style="width:${pct}%"></div></div><p style="color:#94a3b8;font-size:12px">${money(Math.max(0,totalBudget-spent))} remaining • ${pct.toFixed(0)}% used across ${categoryBudgets.length} category budget${categoryBudgets.length===1?'':'s'}</p>`;
}

async function openBudget(id=null){
  editingBudgetId=id||null;
  const existing=id?state.budgets.find(b=>b.id===id):null;
  $("bmonth").value=normalizeMonth(existing?.month||currentMonth());
  $("bamount").value=existing?.amount??"";
  $("bcat").innerHTML='<option value="">Overall budget</option>'+state.categories.map(x=>`<option value="${x.id}" data-name="${esc(x.name)}">${esc(x.name)}</option>`).join("");
  $("bcat").value=existing?.category_id||"";
  $("budgetModal").querySelector(".modalHead h2").textContent=existing?"Edit monthly budget":"Add monthly budget";
  $("saveBudget").textContent=existing?"Update budget":"Save budget";
  openModal("budgetModal");
}

async function saveBudget(){
  const month=normalizeMonth($("bmonth").value);
  const amount=Number($("bamount").value);
  const sel=$("bcat").selectedOptions[0];
  const catId=$("bcat").value||null;
  const catName=sel?.dataset.name||null;
  if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(month)||!amount){
    alert("Enter a valid month and amount.");
    return;
  }

  const dbMonth=monthDbDate(month);
  let r;
  if(editingBudgetId){
    r=await sb.from("budgets")
      .update({month:dbMonth,amount,category_id:catId,category_name:catName})
      .eq("id",editingBudgetId)
      .eq("user_id",session.user.id)
      .select()
      .single();
  }else{
    const duplicate=state.budgets.find(
      b=>normalizeMonth(b.month)===month &&
         ((b.category_id||null)===(catId||null))
    );
    if(duplicate){
      alert("A budget already exists for this month and category. Use Edit to update it.");
      return;
    }
    r=await sb.from("budgets")
      .insert({user_id:session.user.id,month:dbMonth,amount,category_id:catId,category_name:catName})
      .select()
      .single();
  }

  if(r.error){alert(r.error.message);return}

  const saved={...r.data,month:normalizeMonth(r.data.month)};
  if(editingBudgetId){
    state.budgets=state.budgets.map(b=>b.id===editingBudgetId?saved:b);
  }else{
    state.budgets.push(saved);
  }

  editingBudgetId=null;
  cache();
  renderHome();
  closeModal("budgetModal");
  $("budgetModal").querySelector(".modalHead h2").textContent="Add monthly budget";
  $("saveBudget").textContent="Save budget";
  toast("Budget "+(saved?"saved":"updated"));
}

async function editBudget(id){
  const b=state.budgets.find(x=>x.id===id);
  if(b)openBudget(id);
}

async function deleteBudget(id){
  const b=state.budgets.find(x=>x.id===id);
  if(!b)return;
  const label=`${b.category_name||"Overall"} budget for ${fmtMonth(normalizeMonth(b.month))}`;
  if(!confirm(`Delete ${label} — ${money(b.amount)}?`))return;
  const r=await sb.from("budgets").delete().eq("id",id).eq("user_id",session.user.id);
  if(r.error){alert(r.error.message);return}
  state.budgets=state.budgets.filter(x=>x.id!==id);
  cache();
  renderHome();
  toast("Budget deleted");
}

function exportCSV(){const cell=v=>`"${String(v??"").replace(/\r?\n/g," ").replace(/"/g,'""')}"`;const rows=[["Date","Expense Detail","Type of Expense","Amount","Paid via","Paid by","Notes"],...state.expenses.map(x=>[x.date,x.detail,x.type,x.amount,x.paidvia,x.paidby,x.notes])];const csv="\uFEFF"+rows.map(r=>r.map(cell).join(",")).join("\r\n")+"\r\n";const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="Pulse_Expenses.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importCSV(file){
 if(!file)return;
 const reader=new FileReader();
 reader.onload=async ev=>{
  const lines=ev.target.result.split(/\r?\n/).filter(Boolean);
  const parse=line=>{const a=[];let c="",q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'&&line[i+1]==='"'){c+='"';i++;}else if(ch==='"')q=!q;else if(ch===","&&!q){a.push(c);c="";}else c+=ch;}a.push(c);return a};
  const rows=lines.slice(1).map(parse);
  const data=rows.map(r=>({user_id:session.user.id,date:r[0]?.trim(),detail:r[1]?.trim(),type:r[2]?.trim(),amount:Number(r[3]),paid_via:r[4]?.trim(),paid_by:r[5]?.trim(),notes:r[6]?.trim()||""})).filter(x=>x.date&&x.detail&&Number.isFinite(x.amount));
  if(!data.length){alert("No valid rows found.");return}
  if(!confirm(`Import ${data.length} expenses? Missing categories, payment methods and Paid by options will be added only from this file.`))return;
  const uid=session.user.id;
  const catNames=[...new Set(data.map(x=>x.type).filter(Boolean))];const payNames=[...new Set(data.map(x=>x.paid_via).filter(Boolean))];const payerNames=[...new Set(data.map(x=>x.paid_by).filter(Boolean))];
  const missingCats=catNames.filter(n=>!state.categories.some(x=>x.name===n)).map(name=>({user_id:uid,name,icon:"•"}));
  const missingPays=payNames.filter(n=>!state.payments.some(x=>x.name===n)).map(name=>({user_id:uid,name}));
  const missingPayers=payerNames.filter(n=>!state.payers.some(x=>x.name===n)).map(name=>({user_id:uid,name}));
  if(missingCats.length){const r=await sb.from("categories").insert(missingCats);if(r.error){alert(r.error.message);return}}
  if(missingPays.length){const r=await sb.from("payment_methods").insert(missingPays);if(r.error){alert(r.error.message);return}}
  if(missingPayers.length){const r=await sb.from("payers").insert(missingPayers);if(r.error){alert(r.error.message);return}}
  const r=await sb.from("expenses").insert(data);if(r.error){alert(r.error.message);return}
  await loadAll();toast("Import complete");
 };
 reader.readAsText(file);
}
function financialTotals(f){
 const x=f||{}; const inv={sip:Number(x.sip||0),market:Number(x.market||0),rd:Number(x.rd||0),fd:Number(x.fd||0),gold:Number(x.gold||0),ppf:Number(x.ppf||0),other:Number(x.other||0)};
 const invested=Object.values(inv).reduce((a,b)=>a+b,0),income=Number(x.income||0),rate=income>0?invested/income*100:0;
 const spent=state.expenses.filter(e=>monthKey(e.date)===(x.month||currentMonth())).reduce((a,e)=>a+Number(e.amount||0),0);
 return {income,inv,invested,rate,spent,cashAfterExpenses:income-spent};
}
function zoneFor(rate){if(rate>=30)return {cls:"good",icon:"🟢",title:"Preferred zone",text:"30%+ of salary invested"};if(rate>=20)return {cls:"warn",icon:"🟡",title:"Good zone",text:"20–29.9% of salary invested"};if(rate>=10)return {cls:"warn",icon:"🟠",title:"Building the habit",text:"10–19.9% of salary invested"};return {cls:"low",icon:"🔴",title:"Needs improvement",text:"Below 10% of salary invested"};}

function savingsMarkup(t){const z=zoneFor(t.rate),width=Math.min(100,Math.max(0,t.rate));return `<div style="margin-top:14px"><div class="moneyFlow"><div class="moneyMetric"><div class="k">Take-home salary</div><div class="v">${money(t.income)}</div></div><div class="moneyMetric"><div class="k">Monthly investments</div><div class="v">${money(t.invested)}</div></div><div class="moneyMetric"><div class="k">Investment rate</div><div class="v">${t.rate.toFixed(1)}%</div></div></div><div class="zone ${z.cls}"><div><b>${z.icon} ${z.title}</b><br><small>${z.text}</small></div><strong>${t.rate.toFixed(1)}%</strong></div><div class="savingsBar"><i style="width:${width}%"></i></div><div class="savingsNote">Monthly expenses: <b>${money(t.spent)}</b> · Cash after recorded expenses: <b>${money(t.cashAfterExpenses)}</b>. Investment-rate guidance is a Pulse planning aid, not financial advice.</div><div class="investGrid" style="margin-top:12px">${investmentRows(t)}</div></div>`;}
function healthFor(t){
 if(!t.income)return {score:null,status:"Set up your monthly income",tone:"low",note:"Add your take-home salary in Savings to unlock your Financial Health score."};
 const savingsRate=Math.max(0,t.cashAfterExpenses/t.income*100);
 const expenseRate=Math.max(0,t.spent/t.income*100);
 const savingPoints=Math.min(60,Math.max(0,savingsRate)/30*60);
 const investPoints=Math.min(25,Math.max(0,t.rate)/30*25);
 const expensePoints=expenseRate<=50?15:expenseRate<=70?10:expenseRate<=90?5:0;
 const score=Math.round(Math.min(100,savingPoints+investPoints+expensePoints));
 if(score>=80)return {score,status:"Strong",tone:"good",note:"Your recorded savings and investment pattern is in a strong Pulse zone."};
 if(score>=60)return {score,status:"Healthy",tone:"good",note:"You are building a healthy money routine. Keep improving consistently."};
 if(score>=40)return {score,status:"Building",tone:"warn",note:"There is a good foundation. Focus on increasing savings and investments over time."};
 return {score,status:"Needs attention",tone:"low",note:"Your current recorded cash flow leaves limited room for savings or investing."};
}

function openGoal(id=null){const g=id?state.goals.find(x=>x.id===id):null;$("gname").value=g?.name||"";$("gtarget").value=g?.target_amount||"";$("gcurrent").value=g?.current_amount||"";$("gdate").value=g?.target_date||"";$("gtype").value=g?.goal_type||"Other";$("saveGoal").dataset.edit=id||"";openModal("goalModal")}
async function saveGoal(){const name=$("gname").value.trim(),target=Number($("gtarget").value||0),current=Number($("gcurrent").value||0),date=$("gdate").value||null,type=$("gtype").value;if(!name||target<=0){alert("Enter a goal name and target amount.");return}const edit=$("saveGoal").dataset.edit,payload={user_id:session.user.id,name,target_amount:target,current_amount:current,target_date:date,goal_type:type};const r=edit?await sb.from("pulse_goals").update(payload).eq("id",edit).eq("user_id",session.user.id).select().single():await sb.from("pulse_goals").insert(payload).select().single();if(r.error){alert(r.error.message);return}if(edit)state.goals=state.goals.map(x=>x.id===edit?r.data:x);else state.goals.push(r.data);closeModal("goalModal");renderWealth();toast(edit?"Goal updated":"Goal added")}
async function deleteGoal(id){const g=state.goals.find(x=>x.id===id);if(!g||!confirm(`Delete goal “${g.name}”?`))return;const r=await sb.from("pulse_goals").delete().eq("id",id).eq("user_id",session.user.id);if(r.error){alert(r.error.message);return}state.goals=state.goals.filter(x=>x.id!==id);renderWealth();toast("Goal deleted")}
function openNetWorth(){const x=state.networth[0];$("nwmonth").value=x?.month||currentMonth();$("nwbank").value=x?.bank_cash||"";$("nwinv").value=x?.investments||"";$("nwgold").value=x?.gold||"";$("nwproperty").value=x?.property_value||"";$("nwother").value=x?.other_assets||"";$("nwloans").value=x?.loans||"";$("nwliab").value=x?.other_liabilities||"";openModal("netWorthModal")}
async function saveNetWorth(){const month=$("nwmonth").value||currentMonth(),payload={user_id:session.user.id,month,bank_cash:Number($("nwbank").value||0),investments:Number($("nwinv").value||0),gold:Number($("nwgold").value||0),property_value:Number($("nwproperty").value||0),other_assets:Number($("nwother").value||0),loans:Number($("nwloans").value||0),other_liabilities:Number($("nwliab").value||0)};const r=await sb.from("pulse_net_worth").upsert(payload,{onConflict:"user_id,month"}).select().single();if(r.error){alert(r.error.message);return}state.networth=[...state.networth.filter(x=>x.month!==month),r.data].sort((a,b)=>b.month.localeCompare(a.month));closeModal("netWorthModal");renderWealth();renderMoneySnapshot();toast("Net worth saved")}
function openRecurringPlan(){$("rname").value="";$("ramount").value="";$("rfreq").value="Monthly";$("rdate").value=new Date().toISOString().slice(0,10);$("rcat").value="";openModal("recurringModal")}
async function saveRecurringPlan(){const name=$("rname").value.trim(),amount=Number($("ramount").value||0),frequency=$("rfreq").value,next=$("rdate").value,category=$("rcat").value.trim();if(!name||amount<=0||!next){alert("Complete description, amount and next date.");return}const r=await sb.from("pulse_recurring_plans").insert({user_id:session.user.id,name,amount,frequency,next_date:next,category}).select().single();if(r.error){alert(r.error.message);return}state.recurringPlans.push(r.data);closeModal("recurringModal");renderWealth();toast("Recurring payment added")}
async function deleteRecurringPlan(id){if(!confirm("Delete this recurring payment?"))return;const r=await sb.from("pulse_recurring_plans").delete().eq("id",id).eq("user_id",session.user.id);if(r.error){alert(r.error.message);return}state.recurringPlans=state.recurringPlans.filter(x=>x.id!==id);renderWealth();toast("Recurring payment deleted")}
function openReminder(){$("mname").value="";const d=new Date(Date.now()+86400000);d.setMinutes(0,0,0);$("mdate").value=new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16);$("mpriority").value="Normal";openModal("reminderModal")}
async function saveReminder(){const title=$("mname").value.trim(),due=$("mdate").value,priority=$("mpriority").value;if(!title||!due){alert("Enter reminder and due date.");return}const r=await sb.from("pulse_reminders").insert({user_id:session.user.id,title,due_at:new Date(due).toISOString(),priority,completed:false}).select().single();if(r.error){alert(r.error.message);return}state.reminders.push(r.data);closeModal("reminderModal");renderWealth();toast("Reminder saved")}
async function completeReminder(id){const r=await sb.from("pulse_reminders").update({completed:true}).eq("id",id).eq("user_id",session.user.id);if(r.error){alert(r.error.message);return}state.reminders=state.reminders.map(x=>x.id===id?{...x,completed:true}:x);renderWealth();toast("Reminder completed")}
function backupJSON(){const payload={app:"Pulse",version:"v15.1",exported_at:new Date().toISOString(),profile,expenses:state.expenses,categories:state.categories,payment_methods:state.payments,payers:state.payers,budgets:state.budgets,monthly_financial:state.financial,goals:state.goals,net_worth:state.networth,recurring_plans:state.recurringPlans,reminders:state.reminders};const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}));a.download=`Pulse_Backup_${currentMonth()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("Complete Pulse backup downloaded")}

function renderReports(){
 const el=$("reportMonth"); if(!el)return;
 const months=[...new Set(state.expenses.map(x=>monthKey(x.date)))].sort().reverse();
 const current=el.value||currentMonth();
 el.innerHTML=months.length?months.map(m=>`<option value="${m}">${fmtMonth(m)}</option>`).join(""):`<option value="${currentMonth()}">${fmtMonth(currentMonth())}</option>`;
 if(months.includes(current))el.value=current;else el.value=months[0]||currentMonth();
 const m=el.value;const a=state.expenses.filter(x=>monthKey(x.date)===m);const total=a.reduce((s,x)=>s+Number(x.amount||0),0);
 $("reportTotal").textContent=money(total);$("reportCount").textContent=a.length;$("reportDaily").textContent=money(total/(new Date(Number(m.slice(0,4)),Number(m.slice(5,7)),0).getDate()));
 const largest=a.reduce((best,x)=>!best||x.amount>best.amount?x:best,null);$("reportLargest").textContent=money(largest?.amount||0);$("reportLargestName").textContent=largest?.detail||"—";
 const build=(items)=>{const max=Math.max(...items.map(x=>x[1]),1);return items.length?items.map(([name,val])=>`<div class="reportRow"><div class="reportMeta"><div><b>${esc(name)}</b></div><div class="reportBar"><i style="width:${(val/max*100).toFixed(1)}%"></i></div></div><div class="reportAmount">${money(val)}</div></div>`).join(''):'<div class="empty">No data for this month.</div>'};
 const cats=Object.entries(a.reduce((o,x)=>(o[x.type]=(o[x.type]||0)+Number(x.amount||0),o),{})).sort((x,y)=>y[1]-x[1]);
 const pays=Object.entries(a.reduce((o,x)=>(o[x.paidvia]=(o[x.paidvia]||0)+Number(x.amount||0),o),{})).sort((x,y)=>y[1]-x[1]);
 $("reportCats").innerHTML=build(cats);$("reportPays").innerHTML=build(pays);
}

async function beginDeleteAccount(){closeModal("securityModal");closeModal("settingsModal");closeAccountMenu();$("deleteConfirm").value="";$("deletePassword").value="";$("deleteAccountMsg").textContent="";openModal("deleteAccountModal");setTimeout(()=>$("deleteConfirm")?.focus(),100)}
async function deleteMyAccount(){
 const confirmText=$("deleteConfirm").value.trim();const password=$("deletePassword").value;
 if(confirmText!=="DELETE"){$("deleteAccountMsg").textContent="Type DELETE exactly to continue.";return}
 if(!password){$("deleteAccountMsg").textContent="Enter your current password to re-authenticate.";return}
 const btn=$("confirmDeleteAccount");btn.disabled=true;btn.textContent="Deleting…";$("deleteAccountMsg").textContent="Re-authenticating and securely deleting your account…";
 try{
  const reauth=await sb.auth.signInWithPassword({email:session.user.email,password});
  if(reauth.error)throw new Error("Password verification failed. Your account was not deleted.");
  const r=await sb.functions.invoke("delete-account",{body:{}});
  if(r.error){let msg=r.error.message||"Account deletion failed.";if(r.data?.error)msg=r.data.error;throw new Error(msg)}
  await sb.auth.signOut();localStorage.removeItem(`pulse-onboard-seen-${session.user.id}`);localStorage.removeItem(LEGACY_CONFIG_KEY);location.reload();
 }catch(err){$("deleteAccountMsg").textContent=err.message||"Account deletion failed. Nothing was deleted.";btn.disabled=false;btn.textContent="Delete permanently"}
}

function bindWealthQuickActions(){const a=$("wealthQuickSavings");if(a)a.onclick=()=>openSavings();const b=$("wealthQuickGoal");if(b)b.onclick=()=>openGoal();const c=$("wealthQuickNet");if(c)c.onclick=()=>openNetWorth();const d=$("wealthQuickReport");if(d)d.onclick=()=>setView("reports");}
function renderApp(){
 appShell();renderHome();renderExpenseList();bindWealthQuickActions();
 const greetingName=profile?.display_name||session.user.email.split("@")[0];
 const greetingTime=new Date().getHours()<12?"morning":new Date().getHours()<18?"afternoon":"evening";
 $("greeting").innerHTML=`<span class="greetingHello">Good ${greetingTime} 👋</span><span class="greetingName">${esc(greetingName)}</span>`;
 maybeShowOnboarding();
}

(async()=>{
 try{
  if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).catch(()=>{});}
  loadCache();const c=getConfig();if(!c.url||!c.key){configScreen();return}await initClient();
 }catch(err){console.error("Pulse startup error",err);document.body.innerHTML=`<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#070a12;color:#fff;font-family:system-ui"><div style="max-width:520px;text-align:center"><h2>Pulse couldn't start</h2><p style="color:#94a3b8">Please refresh the page. If the problem continues, check your internet connection and Supabase configuration.</p><button onclick="location.reload()" style="padding:12px 18px;border:0;border-radius:12px;background:#8b5cf6;color:#fff;font-weight:800;cursor:pointer">Refresh Pulse</button></div></div>`;
 }
})();
})();
